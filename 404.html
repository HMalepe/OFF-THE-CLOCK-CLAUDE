<!DOCTYPE html>
<html lang="en-ZA" class="static">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page not found — Off The Clock</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0E2340">
  <!-- Absolute paths: a 404 can be served from any URL depth -->
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/source-serif-4-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="page page--404">
  <main class="notfound" id="main">
    <svg class="clock notfound__clock" viewBox="0 0 100 100" aria-hidden="true">
      <circle class="clock__ring" cx="50" cy="50" r="50"/>
      <circle class="clock__face" cx="50" cy="50" r="22"/>
      <path class="clock__hand" d="M50 50V28A22 22 0 0 1 72 50Z"/>
    </svg>
    <p class="eyebrow eyebrow--sky">Error 404</p>
    <h1 class="h-display">This page is <em>off the clock.</em></h1>
    <p>The link may be old, or the page has moved. Let’s get you back to the conversation.</p>
    <a class="btn btn--sky" href="/">Back to Off The Clock</a>
  </main>
</body>
</html>
